<!DOCTYPE html>
<html>
<head>
  <title>Update Driver Status</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script>
    // Firebase configuration from environment variables
    const firebaseConfig = {
      apiKey: "AIzaSyAee-TmtHeEI0jOJGUUqLyMMP7nvRUYzMA",
      authDomain: "carzi-holidays-f4be3.firebaseapp.com",
      projectId: "carzi-holidays-f4be3",
      storageBucket: "carzi-holidays-f4be3.firebasestorage.app",
      messagingSenderId: "938487746105",
      appId: "1:938487746105:web:1a1a1a1a1a1a1a1a1a1a1a"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    async function updateDriverStatus(driverId, status) {
      try {
        await db.collection('drivers').doc(driverId).update({
          status: status,
          updatedAt: new Date().toISOString()
        });
        console.log(`Successfully updated driver ${driverId} status to ${status}`);
        
        // Verify the update
        const doc = await db.collection('drivers').doc(driverId).get();
        console.log('Updated driver document:', doc.data());
        alert(`Successfully updated driver status to ${status}. Check console for details.`);
      } catch (error) {
        console.error('Error updating driver status:', error);
        alert('Error updating driver status. Check console for details.');
      }
    }

    // Sign in as admin (you'll need to enter your admin credentials)
    function signIn() {
      const email = prompt('Enter admin email:');
      const password = prompt('Enter admin password:');
      
      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          console.log('Signed in as:', userCredential.user.email);
          document.getElementById('updateBtn').disabled = false;
          alert('Successfully signed in! Click the Update Status button.');
        })
        .catch((error) => {
          console.error('Sign in error:', error);
          alert('Sign in failed: ' + error.message);
        });
    }
  </script>
</head>
<body>
  <h1>Update Driver Status</h1>
  <p>This tool will update the driver's status in Firestore.</p>
  
  <button onclick="signIn()">Sign In</button>
  <button id="updateBtn" onclick="updateDriverStatus('a7hFsh0LoyNl7AnRVDCHDLAg2bV2', 'active')" disabled>Update Driver Status to Active</button>
  
  <p>Check the browser console for operation logs.</p>
</body>
</html>
